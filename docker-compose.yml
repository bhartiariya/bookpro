version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: bookpro_db
    environment:
      POSTGRES_USER: bookpro_user
      POSTGRES_PASSWORD: bookpro_pass
      POSTGRES_DB: bookpro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bookpro_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
